<style id="mx-offline-tour-style">

x/1.25 Georgia,"Songti SC",serif;margin:9px 0 7px}.mx-offline-tour-card p{margin:0;color:var(--mx-tour-muted);font-size:13px;line-height:1.66}.mx-offline-tour-say{display:block;margin-top:7px;color:#9a7565;font-size:12px;line-height:1.55}.mx-offline-tour-speed{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:11px;color:#82786e}.mx-offline-tour-speed select{border:1px solid var(--mx-tour-line);border-radius:999px;background:white;padding:5px 9px;color:#3d3833}.mx-offline-tour-phases{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:13px 0 10px}.mx-offline-tour-phases i{height:4px;border-radius:999px;background:#e9e1d8}.mx-offline-tour-phases i.done{background:#9bc7b6}.mx-offline-tour-phases i.on{background:var(--mx-tour-green)}.mx-offline-tour-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.mx-offline-tour-actions button{border:1px solid var(--mx-tour-line);border-radius:999px;background:#fff;color:#4a433c;padding:7px 10px;font-size:12px;cursor:pointer}.mx-offline-tour-actions button:disabled{opacity:.35;cursor:not-allowed}.mx-offline-tour-actions button.primary{background:var(--mx-tour-ink);border-color:var(--mx-tour-ink);color:#fff}.mx-offline-tour-actions button.exit{border:0;color:#8a8077;margin-left:auto}.mx-offline-tour-chooser{position:fixed;inset:0;z-index:2147483001;display:none;place-items:center;padding:18px;background:rgba(27,24,21,.46);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.mx-offline-tour-chooser.open{display:grid}.mx-offline-tour-chooser section{width:min(680px,100%);padding:25px;border-radius:25px;background:#fffdfa;box-shadow:0 30px 90px #0005}.mx-offline-tour-chooser h2{font:650 30px/1.16 Georgia,"Songti SC",serif;margin:6px 0 9px}.mx-offline-tour-chooser p{color:#766d64;line-height:1.65;margin:0}.mx-offline-tour-speed-grid{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:20px 0 12px;padding:13px;border:1px solid var(--mx-tour-line);border-radius:15px}.mx-offline-tour-speed-grid div{display:flex;gap:6px;flex-wrap:wrap}.mx-offline-tour-speed-grid button{border:1px solid var(--mx-tour-line);border-radius:10px;background:#fff;padding:8px 11px}.mx-offline-tour-speed-grid button.on{background:var(--mx-tour-green);border-color:var(--mx-tour-green);color:#fff}.mx-offline-tour-modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mx-offline-tour-modes button{min-height:132px;border:0;border-radius:19px;padding:19px;text-align:left;color:#fff;background:linear-gradient(135deg,#075943,#1da77e);cursor:pointer}.mx-offline-tour-modes button+button{background:linear-gradient(135deg,#673625,#c46f50)}.mx-offline-tour-modes b{display:block;font-size:20px;margin-bottom:8px}.mx-offline-tour-modes span{font-size:13px;line-height:1.6}.mx-offline-tour-later{display:block;margin:15px auto 0;border:0;background:transparent;color:#82786e;cursor:pointer}.mx-offline-tour-route{position:fixed;inset:0;z-index:2147483002;display:none;place-items:center;background:#f7f2eb;color:#211f1c;font:700 16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.mx-offline-tour-route.on{display:grid}

async function go(index){if(index<0)return;if(index>=C.steps.length){finish();return}const my=++generation;clearTimeout(timer);const old=C.steps[step];if(layer.classList.contains("is-open")&&old&&index!==step)await commands(old.leave,90);step=index;const s=C.steps[step];if(s.route!==C.currentRoute){navigate(s.route,step);return}layer.classList.add("is-open");render(s);if(s.settleMs)await sleep(scaled(s.settleMs,120));await commands(s.enter);await sleep(scaled(220,80));if(my!==generation)return;const el=await waitTarget(s.target,2400);if(my!==generation)return;place(el);if(mode==="auto"&&!paused){const dwell=Math.max(1100,scaled(s.wait,700));timer=setTimeout(()=>go(step+1),dwell)}}
